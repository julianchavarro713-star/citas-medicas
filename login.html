<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Inicio de Sesión</title>
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0;
}

.login-container {
  background: white;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  width: 350px;
}

.login-container h2 {
  text-align: center;
  margin-bottom: 30px;
  color: #333;
}

.campo {
  margin-bottom: 20px;
}

.campo label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
  color: #555;
}

.password-container {
  position: relative;
  display: flex;
  align-items: center;
}

.password-container input {
  width: 100%;
  padding: 12px;
  padding-right: 45px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 14px;
}

.password-container input:focus {
  outline: none;
  border-color: #667eea;
}

.password-container button {
  position: absolute;
  right: 8px;
  width: 35px;
  height: 35px;
  padding: 0;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;
  border-radius: 5px;
  transition: all 0.2s;
}

.password-container button:hover {
  background: #f0f0f0;
  transform: none;
}

.campo input {
  width: 100%;
  padding: 12px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 14px;
}

.campo input:focus {
  outline: none;
  border-color: #667eea;
}

button {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s;
}

button:hover {
  transform: translateY(-2px);
}

.link {
  text-align: center;
  margin-top: 20px;
}

.link a {
  color: #667eea;
  text-decoration: none;
}

.mensaje {
  margin-top: 20px;
  padding: 10px;
  border-radius: 8px;
  text-align: center;
}
</style>
</head>
<body>
<div class="login-container">
  <h2>🔐 Iniciar Sesión</h2>
  <div class="campo">
    <label>📧 Correo electrónico</label>
    <input type="email" id="correo" placeholder="ejemplo@correo.com">
  </div>
  <div class="campo">
    <label>🔒 Contraseña</label>
    <div class="password-container">
      <input type="password" id="password" placeholder="******">
      <button onclick="togglePassword()" type="button">👁️</button>
    </div>
  </div>
  <button onclick="iniciarSesion()">Ingresar</button>
  <div class="link">
    <a href="registro.html">📝 ¿No tienes cuenta? Regístrate</a>
  </div>
  <div id="mensaje" class="mensaje"></div>
</div>

<script>
function togglePassword() {
  const passwordInput = document.getElementById("password");
  const button = event.target;
  
  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    button.textContent = "🙈";
  } else {
    passwordInput.type = "password";
    button.textContent = "👁️";
  }
}

function iniciarSesion() {
  const correo = document.getElementById("correo").value;
  const password = document.getElementById("password").value;
  
  if (!correo || !password) {
    document.getElementById("mensaje").innerHTML = '<div style="background:#ffe6e6;color:#ff3333;">⚠️ Por favor complete todos los campos</div>';
    return;
  }
  
  fetch("http://localhost:3000/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ correo, password })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      localStorage.setItem("usuario", JSON.stringify(data.usuario));
      window.location.href = "citas.html";
    } else {
      document.getElementById("mensaje").innerHTML = '<div style="background:#ffe6e6;color:#ff3333;">❌ Correo o contraseña incorrectos</div>';
    }
  })
  .catch(error => {
    console.error("Error:", error);
    document.getElementById("mensaje").innerHTML = '<div style="background:#ffe6e6;color:#ff3333;">❌ Error al conectar con el servidor</div>';
  });
}
</script>
</body>
</html>
