<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de Usuarios</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 800px;
  margin: 0 auto;
  background: white;
  border-radius: 15px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  overflow: hidden;
}

.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 30px;
  text-align: center;
}

.header h1 {
  margin-bottom: 10px;
}

.formulario {
  padding: 30px;
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.campo {
  margin-bottom: 20px;
}

.campo label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
  color: #333;
}

.campo input, .campo select {
  width: 100%;
  padding: 10px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 14px;
  transition: border-color 0.3s;
}

.campo input:focus, .campo select:focus {
  outline: none;
  border-color: #667eea;
}

.password-container {
  position: relative;
  display: flex;
  align-items: center;
}

.password-container input {
  flex: 1;
  padding-right: 45px;
}

.password-container button {
  position: absolute;
  right: 5px;
  width: 35px;
  height: 35px;
  padding: 0;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;
  border-radius: 5px;
  transition: all 0.2s;
}

.password-container button:hover {
  background: #f0f0f0;
  transform: none;
}

button {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s;
}

button:hover {
  transform: translateY(-2px);
}

.enlace {
  text-align: center;
  margin-top: 20px;
  padding: 20px;
  background: #f5f5f5;
}

.enlace a {
  color: #667eea;
  text-decoration: none;
}

.usuarios-lista {
  margin-top: 30px;
  padding: 20px;
  background: #f9f9f9;
  border-radius: 10px;
}

.usuario-card {
  background: white;
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 8px;
  border-left: 4px solid #667eea;
}

.usuario-card strong {
  color: #333;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📝 Registro de Pacientes</h1>
    <p>Complete sus datos para agendar citas médicas</p>
  </div>
  
  <div class="formulario">
    <div class="grid-2">
      <div class="campo">
        <label>Nombre completo *</label>
        <input type="text" id="nombre" placeholder="Ej: Juan Pérez">
      </div>
      <div class="campo">
        <label>Correo electrónico *</label>
        <input type="email" id="correo" placeholder="ejemplo@correo.com">
      </div>
      <div class="campo">
        <label>Contraseña *</label>
        <div class="password-container">
          <input type="password" id="password" placeholder="******">
          <button onclick="togglePassword()" type="button">👁️</button>
        </div>
      </div>
      <div class="campo">
        <label>Edad</label>
        <input type="number" id="edad" placeholder="25">
      </div>
      <div class="campo">
        <label>Teléfono</label>
        <input type="tel" id="telefono" placeholder="3001234567">
      </div>
      <div class="campo">
        <label>Documento de identidad</label>
        <input type="text" id="documento" placeholder="CC 12345678">
      </div>
      <div class="campo">
        <label>Dirección</label>
        <input type="text" id="direccion" placeholder="Calle 123 #45-67">
      </div>
      <div class="campo">
        <label>Estatura (cm)</label>
        <input type="number" id="estatura" placeholder="170">
      </div>
      <div class="campo">
        <label>Tipo de sangre</label>
        <select id="tipoSangre">
          <option value="">Seleccione</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
        </select>
      </div>
    </div>
    
    <!-- Preguntas de seguridad -->
    <div class="grid-2">
      <div class="campo">
        <label>🔐 Pregunta de seguridad *</label>
        <select id="preguntaSeguridad">
          <option value="">Seleccione una pregunta</option>
          <option value="Nombre de tu madre">¿Cuál es el nombre de tu madre?</option>
          <option value="Tu deporte favorito">¿Cuál es tu deporte favorito?</option>
          <option value="Ano donde naciste">¿En qué año naciste?</option>
          <option value="Tu color favorito">¿Cuál es tu color favorito?</option>
          <option value="Ciudad donde naciste">¿En qué ciudad naciste?</option>
        </select>
      </div>
      <div class="campo">
        <label>🔐 Respuesta de seguridad *</label>
        <input type="text" id="respuestaSeguridad" placeholder="Tu respuesta (minúsculas)">
      </div>
    </div>
    
    <button onclick="registrarUsuario()">✅ Registrarse</button>
  </div>
  
  <div class="enlace">
    <a href="login.html">🔐 ¿Ya tienes cuenta? Inicia sesión aquí</a> |
    <a href="citas.html">📅 Agendar cita</a> |
    <a href="admin.html">👑 Panel Administrativo</a>
  </div>
  
  <div id="listaUsuarios" class="usuarios-lista"></div>
</div>

<script>
const API_URL = "https://citas-medicas-slg0.onrender.com";

function togglePassword() {
  const passwordInput = document.getElementById("password");
  const button = event.target;
  
  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    button.textContent = "🙈";
  } else {
    passwordInput.type = "password";
    button.textContent = "👁️";
  }
}

async function registrarUsuario() {
  const usuario = {
    nombre: document.getElementById("nombre").value,
    correo: document.getElementById("correo").value,
    password: document.getElementById("password").value,
    edad: parseInt(document.getElementById("edad").value) || 0,
    telefono: document.getElementById("telefono").value,
    documento: document.getElementById("documento").value,
    direccion: document.getElementById("direccion").value,
    estatura: parseInt(document.getElementById("estatura").value) || 0,
    tipoSangre: document.getElementById("tipoSangre").value,
    preguntaSeguridad: document.getElementById("preguntaSeguridad").value,
    respuestaSeguridad: document.getElementById("respuestaSeguridad").value.toLowerCase()
  };
  
  if (!usuario.nombre || !usuario.correo || !usuario.password) {
    alert("⚠️ Por favor complete los campos obligatorios");
    return;
  }
  
  if (!usuario.preguntaSeguridad || !usuario.respuestaSeguridad) {
    alert("⚠️ Por favor complete la pregunta y respuesta de seguridad");
    return;
  }
  
  try {
    const response = await fetch(`${API_URL}/usuarios`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(usuario)
    });
    
    const data = await response.json();
    
    if (response.ok) {
      alert("✅ Usuario registrado exitosamente");
      cargarUsuarios();
      limpiarFormulario();
    } else {
      alert("❌ Error: " + data.error);
    }
  } catch (error) {
    console.error("Error:", error);
    alert("❌ Error al conectar con el servidor. ¿El servidor está corriendo?");
  }
}

function cargarUsuarios() {
  fetch(`${API_URL}/usuarios`)
  .then(res => res.json())
  .then(data => {
    const lista = document.getElementById("listaUsuarios");
    lista.innerHTML = "<h3>📋 Usuarios registrados:</h3>";
    
    data.forEach(u => {
      const div = document.createElement("div");
      div.className = "usuario-card";
      div.innerHTML = `
        <strong>${u.nombre}</strong><br>
        📧 ${u.correo} | 📞 ${u.telefono} | 🩸 ${u.tipoSangre || 'No especificado'}
      `;
      lista.appendChild(div);
    });
  })
  .catch(error => {
    console.error("Error cargando usuarios:", error);
  });
}

function limpiarFormulario() {
  document.getElementById("nombre").value = "";
  document.getElementById("correo").value = "";
  document.getElementById("password").value = "";
  if (document.getElementById("password").type === "text") {
    document.getElementById("password").type = "password";
    document.querySelector(".password-container button").textContent = "👁️";
  }
  document.getElementById("edad").value = "";
  document.getElementById("telefono").value = "";
  document.getElementById("documento").value = "";
  document.getElementById("direccion").value = "";
  document.getElementById("estatura").value = "";
  document.getElementById("tipoSangre").value = "";
  document.getElementById("preguntaSeguridad").value = "";
  document.getElementById("respuestaSeguridad").value = "";
}

cargarUsuarios();
</script>
</body>
</html>
