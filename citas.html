<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Citas Médicas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .header { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 20px; text-align: center; }
        .formulario { padding: 20px; }
        .campo { margin-bottom: 15px; }
        .campo label { display: block; margin-bottom: 5px; font-weight: bold; }
        .campo input, .campo select, .campo textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 10px; margin-top: 10px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-cerrar { background: #ff4444; }
        .btn-ver { background: #2196F3; }
        .cita-card { background: #f8f9fa; padding: 10px; margin-bottom: 10px; border-radius: 5px; border-left: 4px solid #667eea; display: flex; justify-content: space-between; align-items: center; }
        .cita-acciones button { width: auto; margin-top: 0; margin-left: 5px; padding: 5px 10px; font-size: 12px; }
        .btn-pdf { background: #28a745; }
        .btn-eliminar { background: #ff4444; }
        .info-usuario { background: #e8f4f8; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>🏥 Mis Citas Médicas</h1></div>
    <div class="formulario">
        <div id="infoUsuario" class="info-usuario"></div>
        <div class="grid-2">
            <div class="campo"><label>📅 Fecha</label><input type="date" id="fecha"></div>
            <div class="campo"><label>⏰ Hora</label><input type="time" id="hora"></div>
            <div class="campo"><label>🏥 Sede</label><select id="centroMedico"><option value="">Seleccione</option><option value="Urgencias Toberin">Urgencias Toberin</option><option value="La Cardio">La Cardio</option><option value="Colina">Colina</option></select></div>
            <div class="campo"><label>👨‍⚕️ Doctor</label><select id="doctor"><option value="">Seleccione</option><option value="Julian Chavarro">Dr. Julian Chavarro</option><option value="Camilo Carrillo">Dr. Camilo Carrillo</option><option value="Andrea Cardenas">Dra. Andrea Cardenas</option></select></div>
        </div>
        <div class="campo"><label>📋 Motivo</label><textarea id="motivo" rows="2"></textarea></div>
        <button onclick="agendarCita()">📅 Agendar Cita</button>
        <button onclick="cargarCitas()" class="btn-ver">📋 Ver Mis Citas</button>
        <button onclick="cerrarSesion()" class="btn-cerrar">🚪 Cerrar Sesión</button>
        <div id="listaCitas" style="margin-top: 20px;"></div>
    </div>
</div>
<script>
const API_URL = "https://citas-medicas-slg0.onrender.com";

const usuario = localStorage.getItem("usuario");
if (!usuario) { alert("Inicie sesión"); window.location.href = "login.html"; }
const user = JSON.parse(usuario);
document.getElementById("infoUsuario").innerHTML = `👋 Hola, ${user.nombre} | ${user.correo}`;

function cerrarSesion() { localStorage.removeItem("usuario"); window.location.href = "login.html"; }

function agendarCita() {
    const cita = {
        paciente: user.nombre,
        fecha: document.getElementById("fecha").value,
        hora: document.getElementById("hora").value,
        doctor: document.getElementById("doctor").value,
        centroMedico: document.getElementById("centroMedico").value,
        motivo: document.getElementById("motivo").value || "Consulta general"
    };
    if (!cita.fecha || !cita.hora || !cita.doctor || !cita.centroMedico) { alert("Complete todos los campos"); return; }
    fetch(`${API_URL}/citas`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cita)
    }).then(res => res.json()).then(() => { alert("✅ Cita agendada"); cargarCitas(); limpiar(); }).catch(() => alert("Error"));
}

function cargarCitas() {
    fetch(`${API_URL}/citas`).then(res => res.json()).then(data => {
        const misCitas = data.filter(c => c.paciente === user.nombre);
        const contenedor = document.getElementById("listaCitas");
        if (misCitas.length === 0) { contenedor.innerHTML = "<p>No hay citas</p>"; return; }
        contenedor.innerHTML = "";
        misCitas.forEach(c => {
            contenedor.innerHTML += `
                <div class="cita-card">
                    <div><strong>${c.fecha} - ${c.hora}</strong><br>👨‍⚕️ ${c.doctor}<br>🏥 ${c.centroMedico}<br>📋 ${c.motivo}</div>
                    <div class="cita-acciones">
                        <button class="btn-pdf" onclick="descargarPDF('${c._id}', '${c.paciente}', '${c.fecha}', '${c.hora}', '${c.doctor}', '${c.centroMedico}', '${c.motivo}')">📄 PDF</button>
                        <button class="btn-eliminar" onclick="eliminarCita('${c._id}')">❌</button>
                    </div>
                </div>`;
        });
    });
}

function eliminarCita(id) { if(confirm("¿Cancelar?")) fetch(`${API_URL}/citas/${id}`,{method:"DELETE"}).then(()=>cargarCitas()); }

function descargarPDF(id, paciente, fecha, hora, doctor, centro, motivo) {
    const direcciones = { "Urgencias Toberin": "Calle 45 #20-30", "La Cardio": "Av 19 #120-45", "Colina": "Carrera 7 #180-50" };
    const contenido = `
        <html>
        <head><title>Comprobante</title>
        <style>body{font-family:Arial;padding:40px}.caja{border:2px solid #667eea;border-radius:10px;padding:20px;max-width:500px;margin:auto}.header{background:#667eea;color:white;text-align:center;padding:10px;margin:-20px -20px 20px -20px}.fila{margin:10px 0}.label{font-weight:bold;display:inline-block;width:120px}</style>
        </head>
        <body>
        <div class="caja">
            <div class="header"><h2>🏥 MediCitas Pro</h2><p>COMPROBANTE DE CITA</p><p>${new Date().toLocaleString()}</p></div>
            <div class="fila"><span class="label">Paciente:</span> ${paciente}</div>
            <div class="fila"><span class="label">Fecha:</span> ${fecha}</div>
            <div class="fila"><span class="label">Hora:</span> ${hora}</div>
            <div class="fila"><span class="label">Doctor:</span> ${doctor}</div>
            <div class="fila"><span class="label">Centro:</span> ${centro}</div>
            <div class="fila"><span class="label">Dirección:</span> ${direcciones[centro] || ""}</div>
            <div class="fila"><span class="label">Motivo:</span> ${motivo}</div>
            <div class="fila"><span class="label">Código:</span> ${id.substring(0,8)}</div>
            <p style="text-align:center; margin-top:20px;">Gracias por su preferencia</p>
        </div>
        </body>
        </html>
    `;
    const win = window.open();
    win.document.write(contenido);
    win.document.close();
    win.print();
}

function limpiar() { document.getElementById("fecha").value=""; document.getElementById("hora").value=""; document.getElementById("doctor").value=""; document.getElementById("centroMedico").value=""; document.getElementById("motivo").value=""; }
cargarCitas();
</script>
</body>
</html>
