<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Agendar Cita Médica</title>
<!-- Librería para generar PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 800px;
  margin: 0 auto;
  background: white;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  overflow: hidden;
}

.header {
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  color: white;
  padding: 30px;
  text-align: center;
}

.header h1 {
  margin-bottom: 10px;
}

.header p {
  opacity: 0.9;
}

.formulario {
  padding: 30px;
}

.campo {
  margin-bottom: 20px;
}

.campo label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
  color: #333;
  font-size: 14px;
}

.campo label .opcional {
  font-weight: normal;
  color: #999;
  font-size: 12px;
}

.campo input, .campo select, .campo textarea {
  width: 100%;
  padding: 12px;
  border: 2px solid #e0e0e0;
  border-radius: 10px;
  font-size: 14px;
  transition: border-color 0.3s;
  font-family: inherit;
}

.campo input:focus, .campo select:focus, .campo textarea:focus {
  outline: none;
  border-color: #4facfe;
}

.campo input[readonly] {
  background-color: #f5f5f5;
  cursor: not-allowed;
}

.campo textarea {
  resize: vertical;
  min-height: 80px;
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

button {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s;
  margin-bottom: 10px;
}

button:hover {
  transform: translateY(-2px);
}

.btn-cerrar {
  background: linear-gradient(135deg, #ff4444, #cc0000);
}

.btn-ver {
  background: linear-gradient(135deg, #667eea, #764ba2);
}

.lista {
  margin-top: 30px;
  padding: 20px;
  background: #f8f9fa;
  border-radius: 15px;
}

.lista h3 {
  margin-bottom: 15px;
  color: #333;
}

.cita-card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 12px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  border-left: 4px solid #4facfe;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
}

.cita-info {
  flex: 1;
}

.cita-info strong {
  font-size: 16px;
  color: #333;
}

.cita-info p {
  margin-top: 5px;
  font-size: 13px;
  color: #666;
}

.motivo-info {
  background: #f8f9fa;
  padding: 8px;
  border-radius: 8px;
  margin-top: 8px;
  font-style: italic;
}

.btn-eliminar {
  background: #ff4444;
  padding: 8px 15px;
  font-size: 12px;
  width: auto;
  margin-bottom: 0;
}

.btn-pdf {
  background: #28a745;
  padding: 8px 15px;
  font-size: 12px;
  width: auto;
  margin-bottom: 0;
  margin-left: 10px;
}

.btn-pdf:hover {
  background: #218838;
}

.cita-acciones {
  display: flex;
  gap: 10px;
}

.mensaje-vacio {
  text-align: center;
  padding: 30px;
  color: #999;
}

.info-usuario {
  background: linear-gradient(135deg, #e8f4f8, #d1ecf1);
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 25px;
  text-align: center;
}

.info-usuario span {
  font-weight: bold;
  color: #4facfe;
}

.sedes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-top: 5px;
}

.doctores {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 5px;
}

.opcion-sede {
  padding: 10px;
  border: 2px solid #e0e0e0;
  border-radius: 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
}

.opcion-sede:hover {
  border-color: #4facfe;
  background: #f0f9ff;
}

.opcion-sede.seleccionada {
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  color: white;
  border-color: #4facfe;
}

.opcion-doctor {
  padding: 10px;
  border: 2px solid #e0e0e0;
  border-radius: 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  background: white;
}

.opcion-doctor:hover {
  border-color: #4facfe;
  background: #f0f9ff;
}

.opcion-doctor.seleccionado {
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  color: white;
  border-color: #4facfe;
}

.doctores-container {
  border: 1px solid #e0e0e0;
  border-radius: 10px;
  padding: 15px;
  min-height: 200px;
  background: #fafafa;
}

.doctores-container h4 {
  margin-bottom: 10px;
  color: #333;
  font-size: 14px;
}

.doctores-vacio {
  text-align: center;
  padding: 40px;
  color: #999;
  font-style: italic;
}

@media (max-width: 600px) {
  .cita-card {
    flex-direction: column;
    text-align: center;
  }
  .cita-acciones {
    margin-top: 10px;
  }
  .grid-2 {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🏥 Agendar Cita Médica</h1>
    <p>Complete los datos para programar su cita</p>
  </div>
  
  <div class="formulario">
    <div id="infoUsuario" class="info-usuario"></div>

    <div class="grid-2">
      <div class="campo">
        <label>👤 Nombre del Paciente</label>
        <input type="text" id="paciente" readonly placeholder="Nombre del paciente">
      </div>
      
      <div class="campo">
        <label>📅 Fecha de la Cita</label>
        <input type="date" id="fecha">
      </div>
      
      <div class="campo">
        <label>⏰ Hora de la Cita</label>
        <input type="time" id="hora">
      </div>
      
      <div class="campo">
        <label>🏥 Seleccione Sede / Centro Médico</label>
        <div class="sedes">
          <div class="opcion-sede" data-sede="Urgencias Toberin">🏥 Urgencias Toberin</div>
          <div class="opcion-sede" data-sede="La Cardio">❤️ La Cardio</div>
          <div class="opcion-sede" data-sede="Colina">🌳 Colina</div>
        </div>
        <input type="hidden" id="centroMedico">
      </div>
      
      <div class="campo">
        <label>👨‍⚕️ Seleccione Doctor</label>
        <div id="doctoresContainer" class="doctores-container">
          <h4>Primero selecciona una sede</h4>
          <div class="doctores-vacio">🏥 Elige una sede para ver los doctores disponibles</div>
        </div>
        <input type="hidden" id="doctor">
      </div>
    </div>
    
    <!-- Campo Motivo de Consulta (Opcional) -->
    <div class="campo">
      <label>📋 Motivo de Consulta <span class="opcional">(Opcional)</span></label>
      <textarea id="motivo" rows="3" placeholder="Ej: Dolor de cabeza, revisión anual, control médico, etc..."></textarea>
    </div>
    
    <button onclick="crearCita()">📅 Agendar Cita</button>
    <button onclick="verCitas()" class="btn-ver">📋 Ver Mis Citas</button>
    <button onclick="cerrarSesion()" class="btn-cerrar">🚪 Cerrar Sesión</button>
    
    <div id="lista" class="lista">
      <h3>📌 Mis Próximas Citas</h3>
      <div id="citasLista"></div>
    </div>
  </div>
</div>

<script>
const API_URL = "https://citas-medicas-slg0.onrender.com";

// Definir doctores por sede
const doctoresPorSede = {
  "Urgencias Toberin": [
    { nombre: "Julian Chavarro", especialidad: "Cardiólogo" },
    { nombre: "Camilo Carrillo", especialidad: "Médico General" },
    { nombre: "David Andres", especialidad: "Urgenciólogo" }
  ],
  "La Cardio": [
    { nombre: "Maria Jose", especialidad: "Cardióloga" },
    { nombre: "Camilo Suarez", especialidad: "Cardiólogo" },
    { nombre: "Manuela Dueñas", especialidad: "Cardióloga" }
  ],
  "Colina": [
    { nombre: "Dana Michell", especialidad: "Médico General" },
    { nombre: "Andres Quintero", especialidad: "Pediatra" },
    { nombre: "Santiago Ortiz", especialidad: "Ortopedista" }
  ]
};

// Verificar usuario logueado
const usuario = localStorage.getItem("usuario");
if (!usuario) {
  alert("Por favor inicie sesión primero");
  window.location.href = "login.html";
}

const userData = JSON.parse(usuario);
document.getElementById("paciente").value = userData.nombre;
document.getElementById("infoUsuario").innerHTML = `
  <span>👋 Bienvenido, ${userData.nombre}</span> | 📧 ${userData.correo}
`;

// Función para mostrar doctores según la sede seleccionada
function mostrarDoctoresPorSede(sede) {
  const container = document.getElementById("doctoresContainer");
  const doctores = doctoresPorSede[sede];
  
  if (!doctores || doctores.length === 0) {
    container.innerHTML = `
      <h4>👨‍⚕️ Doctores disponibles</h4>
      <div class="doctores-vacio">❌ No hay doctores disponibles para esta sede</div>
    `;
    return;
  }
  
  let html = `<h4>👨‍⚕️ Doctores disponibles en ${sede}</h4>\n`;
  html += `<div class="doctores">\n`;
  
  doctores.forEach(doctor => {
    html += `
      <div class="opcion-doctor" data-doctor="${doctor.nombre}" data-especialidad="${doctor.especialidad}">
        👨‍⚕️ ${doctor.nombre} - ${doctor.especialidad}
      </div>
    `;
  });
  
  html += `</div>\n`;
  container.innerHTML = html;
  
  // Agregar eventos de clic a los nuevos doctores
  document.querySelectorAll('.opcion-doctor').forEach(el => {
    el.addEventListener('click', function() {
      document.querySelectorAll('.opcion-doctor').forEach(d => d.classList.remove('seleccionado'));
      this.classList.add('seleccionado');
      document.getElementById('doctor').value = this.dataset.doctor;
    });
  });
}

// Selección de sede
document.querySelectorAll('.opcion-sede').forEach(el => {
  el.addEventListener('click', function() {
    document.querySelectorAll('.opcion-sede').forEach(s => s.classList.remove('seleccionada'));
    this.classList.add('seleccionada');
    const sede = this.dataset.sede;
    document.getElementById('centroMedico').value = sede;
    
    // Limpiar doctor seleccionado
    document.getElementById('doctor').value = "";
    
    // Mostrar doctores de la sede seleccionada
    mostrarDoctoresPorSede(sede);
  });
});

function cerrarSesion() {
  localStorage.removeItem("usuario");
  window.location.href = "login.html";
}

function crearCita() {
  const centroMedico = document.getElementById("centroMedico").value;
  const doctor = document.getElementById("doctor").value;
  const fecha = document.getElementById("fecha").value;
  const hora = document.getElementById("hora").value;
  const paciente = document.getElementById("paciente").value;
  const motivo = document.getElementById("motivo").value;

  if (!centroMedico) {
    alert("⚠️ Por favor seleccione una sede");
    return;
  }
  if (!doctor) {
    alert("⚠️ Por favor seleccione un doctor");
    return;
  }
  if (!fecha) {
    alert("⚠️ Por favor seleccione una fecha");
    return;
  }
  if (!hora) {
    alert("⚠️ Por favor seleccione una hora");
    return;
  }

  const datos = {
    paciente: paciente,
    fecha: fecha,
    hora: hora,
    doctor: doctor,
    centroMedico: centroMedico,
    motivo: motivo || "No especificado"
  };

  fetch(`${API_URL}/citas`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(datos)
  })
  .then(async res => {
    if (res.status === 409) {
      const error = await res.json();
      alert(error.error);
      throw new Error("Horario no disponible");
    }
    if (!res.ok) {
      throw new Error("Error al agendar");
    }
    return res.json();
  })
  .then(data => {
    alert(data.mensaje);
    verCitas();
    limpiarSeleccion();
  })
  .catch(error => {
    if (error.message !== "Horario no disponible") {
      alert("❌ Error al agendar la cita. Intenta de nuevo.");
    }
    console.error("Error:", error);
  });
}

function verCitas() {
  fetch(`${API_URL}/citas`)
  .then(res => res.json())
  .then(data => {
    const citasDiv = document.getElementById("citasLista");
    const usuarioActual = JSON.parse(localStorage.getItem("usuario"));
    
    // Filtrar solo las citas del paciente logueado
    const misCitas = data.filter(c => c.paciente === usuarioActual.nombre);
    
    if (misCitas.length === 0) {
      citasDiv.innerHTML = '<div class="mensaje-vacio">📭 No tienes citas agendadas</div>';
      return;
    }
    
    citasDiv.innerHTML = "";
    misCitas.forEach(c => {
      const div = document.createElement("div");
      div.className = "cita-card";
      let motivoHtml = '';
      if (c.motivo && c.motivo !== "No especificado") {
        motivoHtml = `<div class="motivo-info">📋 Motivo: ${c.motivo}</div>`;
      }
      div.innerHTML = `
        <div class="cita-info">
          <strong>📅 ${c.fecha} - ⏰ ${c.hora}</strong>
          <p>👨‍⚕️ Doctor: ${c.doctor} | 🏥 Sede: ${c.centroMedico}</p>
          ${motivoHtml}
        </div>
        <div class="cita-acciones">
          <button class="btn-eliminar" onclick="eliminarCita('${c._id}')">❌ Cancelar</button>
          <button class="btn-pdf" onclick="descargarPDF('${c._id}')">📄 Descargar PDF</button>
        </div>
      `;
      citasDiv.appendChild(div);
    });
  });
}

function eliminarCita(id) {
  if (confirm("¿Estás seguro de cancelar esta cita?")) {
    fetch(`${API_URL}/citas/${id}`, { method: "DELETE" })
    .then(() => {
      alert("Cita cancelada");
      verCitas();
    });
  }
}

function descargarPDF(idCita) {
  fetch(`${API_URL}/citas`)
    .then(res => res.json())
    .then(citas => {
      const cita = citas.find(c => c._id === idCita);
      
      if (!cita) {
        alert("❌ No se encontró la cita");
        return;
      }
      
      // Obtener teléfono del usuario actual
      const usuarioActual = JSON.parse(localStorage.getItem("usuario"));
      const telefonoUsuario = usuarioActual.telefono || "No registrado";
      
      const fechaFormateada = cita.fecha.split('T')[0];
      const fechaEmision = new Date().toLocaleString();
      const idCorta = idCita.substring(0, 8).toUpperCase();
      const motivoTexto = (cita.motivo && cita.motivo !== "No especificado") ? cita.motivo : "Control y Seguimiento";
      
      // Direcciones por sede
      const direccionesSedes = {
        "Urgencias Toberin": "Calle 45 #20-30, Toberín",
        "La Cardio": "Avenida 19 #120-45, Chapinero",
        "Colina": "Carrera 7 #180-50, Usaquén"
      };
      
      // Consultorio por sede
      const consultorio = cita.centroMedico === "Urgencias Toberin" ? "Consultorio 101" :
                          cita.centroMedico === "La Cardio" ? "Consultorio 205" : "Consultorio 308";
      
      // Obtener especialidad del doctor
      let especialidad = "";
      for (let sede in doctoresPorSede) {
        const doctor = doctoresPorSede[sede].find(d => d.nombre === cita.doctor);
        if (doctor) {
          especialidad = doctor.especialidad;
          break;
        }
      }
      
      const estado = "CONFIRMADA";
      
      const contenido = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>Comprobante Cita Médica</title>
          <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
              font-family: 'Segoe UI', Arial, sans-serif;
              background: #f0f2f5;
              padding: 30px;
              display: flex;
              justify-content: center;
              align-items: center;
              min-height: 100vh;
            }
            .comprobante {
              max-width: 550px;
              width: 100%;
              background: white;
              border-radius: 20px;
              box-shadow: 0 10px 30px rgba(0,0,0,0.15);
              overflow: hidden;
            }
            .header {
              background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
              color: white;
              padding: 25px 20px;
              text-align: center;
            }
            .header h1 {
              font-size: 22px;
              letter-spacing: 2px;
              margin-bottom: 5px;
            }
            .header p {
              font-size: 11px;
              opacity: 0.9;
            }
            .seccion {
              background: #f0f2f5;
              padding: 10px 20px;
              font-weight: bold;
              color: #667eea;
              font-size: 13px;
              border-bottom: 2px solid #667eea;
            }
            .fila {
              display: flex;
              padding: 12px 20px;
              border-bottom: 1px solid #f0f0f0;
            }
            .fila-label {
              width: 110px;
              font-weight: bold;
              color: #555;
              font-size: 12px;
            }
            .fila-valor {
              flex: 1;
              color: #333;
              font-size: 12px;
            }
            .estado {
              color: #28a745;
              font-weight: bold;
            }
            .footer {
              background: #f8f9fa;
              padding: 15px;
              text-align: center;
              font-size: 10px;
              color: #888;
              border-top: 1px solid #e0e0e0;
            }
          </style>
        </head>
        <body>
          <div class="comprobante">
            <div class="header">
              <h1>🏥 MediCitas Pro</h1>
              <p>COMPROBANTE DE CITA MÉDICA</p>
              <p style="font-size: 9px;">Fecha de emisión: ${fechaEmision}</p>
            </div>
            
            <div class="seccion">📋 DATOS DE LA CITA</div>
            <div class="fila">
              <div class="fila-label">Número de cita:</div>
              <div class="fila-valor">${idCorta}</div>
            </div>
            <div class="fila">
              <div class="fila-label">Paciente:</div>
              <div class="fila-valor">${cita.paciente}</div>
            </div>
            <div class="fila">
              <div class="fila-label">Teléfono:</div>
              <div class="fila-valor">${telefonoUsuario}</div>
            </div>
            <div class="fila">
              <div class="fila-label">Fecha:</div>
              <div class="fila-valor">${fechaFormateada}</div>
            </div>
            <div class="fila">
              <div class="fila-label">Hora:</div>
              <div class="fila-valor">${cita.hora}</div>
            </div>
            <div class="fila">
              <div class="fila-label">Estado:</div>
              <div class="fila-valor estado">${estado}</div>
            </div>
            
            <div class="seccion">🏥 DATOS DEL CENTRO MÉDICO</div>
            <div class="fila">
              <div class="fila-label">Centro:</div>
              <div class="fila-valor">${cita.centroMedico}</div>
            </div>
            <div class="fila">
              <div class="fila-label">Dirección:</div>
              <div class="fila-valor">${direccionesSedes[cita.centroMedico] || "Dirección no disponible"}</div>
            </div>
            <div class="fila">
              <div class="fila-label">Consultorio:</div>
              <div class="fila-valor">${consultorio}</div>
            </div>
            
            <div class="seccion">👨‍⚕️ DATOS DEL ESPECIALISTA</div>
            <div class="fila">
              <div class="fila-label">Doctor:</div>
              <div class="fila-valor">${cita.doctor}</div>
            </div>
            <div class="fila">
              <div class="fila-label">Especialidad:</div>
              <div class="fila-valor">${especialidad || "Médico General"}</div>
            </div>
            <div class="fila">
              <div class="fila-label">Tipo de cita:</div>
              <div class="fila-valor">${motivoTexto}</div>
            </div>
            
            <div class="footer">
              <p>Gracias por confiar en MediCitas Pro</p>
              <p>www.medicitaspro.com</p>
            </div>
          </div>
        </body>
        </html>
      `;
      
      // Crear elemento temporal y generar PDF
      const element = document.createElement('div');
      element.innerHTML = contenido;
      element.style.position = 'absolute';
      element.style.left = '-9999px';
      element.style.top = '-9999px';
      document.body.appendChild(element);
      
      html2pdf().from(element).set({
        margin: [0.5, 0.5, 0.5, 0.5],
        filename: `Cita_${cita.paciente}_${fechaFormateada}.pdf`,
        html2canvas: { scale: 2, logging: false },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      }).save().then(() => {
        document.body.removeChild(element);
      }).catch(err => {
        console.error("Error:", err);
        alert("❌ Error al generar el PDF");
        document.body.removeChild(element);
      });
    })
    .catch(error => {
      console.error("Error:", error);
      alert("❌ Error al obtener los datos de la cita");
    });
}

function limpiarSeleccion() {
  document.querySelectorAll('.opcion-sede').forEach(s => s.classList.remove('seleccionada'));
  document.getElementById('centroMedico').value = "";
  document.getElementById('doctor').value = "";
  document.getElementById('fecha').value = "";
