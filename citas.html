<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Citas Médicas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .header { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 20px; text-align: center; }
        .formulario { padding: 20px; }
        .campo { margin-bottom: 15px; }
        .campo label { display: block; margin-bottom: 5px; font-weight: bold; }
        .campo input, .campo select, .campo textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 10px; margin-top: 10px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-cerrar { background: #ff4444; }
        .btn-ver { background: #2196F3; }
        .cita-card { background: #f8f9fa; padding: 10px; margin-bottom: 10px; border-radius: 5px; border-left: 4px solid #667eea; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .cita-acciones button { width: auto; margin-top: 0; margin-left: 5px; padding: 5px 10px; font-size: 12px; }
        .btn-pdf { background: #28a745; }
        .btn-eliminar { background: #ff4444; }
        .info-usuario { background: #e8f4f8; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>🏥 Mis Citas Médicas</h1></div>
    <div class="formulario">
        <div id="infoUsuario" class="info-usuario"></div>
        <div class="grid-2">
            <div class="campo"><label>📅 Fecha</label><input type="date" id="fecha"></div>
            <div class="campo"><label>⏰ Hora</label><input type="time" id="hora"></div>
            <div class="campo"><label>🏥 Sede</label>
                <select id="centroMedico">
                    <option value="">Seleccione</option>
                    <option value="Urgencias Toberin">Urgencias Toberin</option>
                    <option value="La Cardio">La Cardio</option>
                    <option value="Colina">Colina</option>
                </select>
            </div>
            <div class="campo"><label>👨‍⚕️ Doctor</label>
                <select id="doctor">
                    <option value="">Seleccione</option>
                    <option value="Julian Chavarro">Dr. Julian Chavarro</option>
                    <option value="Camilo Carrillo">Dr. Camilo Carrillo</option>
                    <option value="Andrea Cardenas">Dra. Andrea Cardenas</option>
                </select>
            </div>
        </div>
        <div class="campo"><label>📋 Motivo</label><textarea id="motivo" rows="2"></textarea></div>
        <button onclick="agendarCita()">📅 Agendar Cita</button>
        <button onclick="cargarCitas()" class="btn-ver">📋 Ver Citas</button>
        <button onclick="cerrarSesion()" class="btn-cerrar">🚪 Cerrar Sesión</button>
        <div id="listaCitas" style="margin-top: 20px;"></div>
    </div>
</div>
<script>
const API_URL = "https://citas-medicas-slg0.onrender.com";
const usuario = localStorage.getItem("usuario");
if (!usuario) { 
    alert("Inicie sesion primero");
    window.location.href = "login.html";
}
const user = JSON.parse(usuario);
document.getElementById("infoUsuario").innerHTML = "👋 Hola, " + user.nombre;

function cerrarSesion() { 
    localStorage.removeItem("usuario"); 
    window.location.href = "login.html"; 
}

function agendarCita() {
    const cita = {
        paciente: user.nombre,
        fecha: document.getElementById("fecha").value,
        hora: document.getElementById("hora").value,
        doctor: document.getElementById("doctor").value,
        centroMedico: document.getElementById("centroMedico").value,
        motivo: document.getElementById("motivo").value || "Consulta general"
    };
    if (!cita.fecha || !cita.hora || !cita.doctor || !cita.centroMedico) { 
        alert("Complete todos los campos"); 
        return; 
    }
    
    fetch(API_URL + "/citas", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cita)
    })
    .then(response => response.json())
    .then(data => { 
        alert(data.mensaje || "Cita agendada"); 
        cargarCitas(); 
        limpiar(); 
    })
    .catch(error => {
        console.error("Error:", error);
        alert("Error al agendar cita");
    });
}

function cargarCitas() {
    fetch(API_URL + "/citas")
    .then(response => response.json())
    .then(data => {
        const misCitas = data.filter(c => c.paciente === user.nombre);
        const contenedor = document.getElementById("listaCitas");
        if (misCitas.length === 0) { 
            contenedor.innerHTML = "<p>No hay citas agendadas</p>"; 
            return; 
        }
        contenedor.innerHTML = "";
        for (let i = 0; i < misCitas.length; i++) {
            const c = misCitas[i];
            contenedor.innerHTML += `
                <div class="cita-card">
                    <div>
                        <strong>${c.fecha} - ${c.hora}</strong><br>
                        👨‍⚕️ Doctor: ${c.doctor}<br>
                        🏥 Sede: ${c.centroMedico}<br>
                        📋 Motivo: ${c.motivo}
                    </div>
                    <div class="cita-acciones">
                        <button class="btn-pdf" onclick="generarPDF('${c._id}')">📄 PDF</button>
                        <button class="btn-eliminar" onclick="eliminarCita('${c._id}')">❌ Cancelar</button>
                    </div>
                </div>
            `;
        }
    })
    .catch(error => {
        console.error("Error:", error);
        document.getElementById("listaCitas").innerHTML = "<p>Error al cargar citas</p>";
    });
}

function eliminarCita(id) { 
    if(confirm("¿Cancelar esta cita?")) {
        fetch(API_URL + "/citas/" + id, { method: "DELETE" })
        .then(() => { 
            alert("Cita cancelada");
            cargarCitas(); 
        })
        .catch(error => {
            console.error("Error:", error);
            alert("Error al cancelar cita");
        });
    }
}

function generarPDF(idCita) {
    fetch(API_URL + "/citas").then(res => res.json()).then(data => {
        const c = data.find(x => x._id === idCita);
        if (!c) { alert("No encontrada"); return; }
        
        const direcciones = {
            "Urgencias Toberin": "Calle 45 #20-30, Toberin",
            "La Cardio": "Avenida 19 #120-45, Chapinero",
            "Colina": "Carrera 7 #180-50, Usaquen"
        };
        
        const element = document.createElement('div');
        element.style.position = 'absolute';
        element.style.left = '-9999px';
        element.style.top = '-9999px';
        element.style.background = 'white';
        element.style.padding = '20px';
        element.style.width = '600px';
        element.innerHTML = `
            <div style="font-family: Arial, sans-serif;">
                <div style="text-align:center; border-bottom:2px solid #667eea; padding-bottom:10px; margin-bottom:20px;">
                    <h2 style="color:#667eea;">🏥 MediCitas Pro</h2>
                    <p>COMPROBANTE DE CITA MÉDICA</p>
                    <p>${new Date().toLocaleString()}</p>
                </div>
                <p><strong>Paciente:</strong> ${c.paciente}</p>
                <p><strong>Fecha:</strong> ${c.fecha}</p>
                <p><strong>Hora:</strong> ${c.hora}</p>
                <p><strong>Doctor:</strong> ${c.doctor}</p>
                <p><strong>Sede:</strong> ${c.centroMedico}</p>
                <p><strong>Dirección:</strong> ${direcciones[c.centroMedico] || "No disponible"}</p>
                <p><strong>Motivo:</strong> ${c.motivo || "Consulta general"}</p>
                <p><strong>Estado:</strong> CONFIRMADA</p>
                <div style="text-align:center; font-size:12px; margin-top:30px; border-top:1px solid #ccc; padding-top:15px;">
                    Gracias por confiar en MediCitas Pro
                </div>
            </div>
        `;
        
        document.body.appendChild(element);
        html2pdf().from(element).set({
            margin: 0.5,
            filename: `Cita_${c.paciente}_${c.fecha}.pdf`,
            html2canvas: { scale: 2 }
        }).save().then(() => {
            document.body.removeChild(element);
        });
    });
}

function limpiar() { 
    document.getElementById("fecha").value = ""; 
    document.getElementById("hora").value = ""; 
    document.getElementById("doctor").value = ""; 
    document.getElementById("centroMedico").value = ""; 
    document.getElementById("motivo").value = ""; 
}

cargarCitas();
</script>
</body>
</html>
