<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Agendar Cita Médica</title>
<!-- Librería para generar PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 800px;
  margin: 0 auto;
  background: white;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  overflow: hidden;
}

.header {
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  color: white;
  padding: 30px;
  text-align: center;
}

.header h1 {
  margin-bottom: 10px;
}

.header p {
  opacity: 0.9;
}

.formulario {
  padding: 30px;
}

.campo {
  margin-bottom: 20px;
}

.campo label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
  color: #333;
  font-size: 14px;
}

.campo input, .campo select {
  width: 100%;
  padding: 12px;
  border: 2px solid #e0e0e0;
  border-radius: 10px;
  font-size: 14px;
  transition: border-color 0.3s;
}

.campo input:focus, .campo select:focus {
  outline: none;
  border-color: #4facfe;
}

.campo input[readonly] {
  background-color: #f5f5f5;
  cursor: not-allowed;
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

button {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s;
  margin-bottom: 10px;
}

button:hover {
  transform: translateY(-2px);
}

.btn-cerrar {
  background: linear-gradient(135deg, #ff4444, #cc0000);
}

.btn-ver {
  background: linear-gradient(135deg, #667eea, #764ba2);
}

.lista {
  margin-top: 30px;
  padding: 20px;
  background: #f8f9fa;
  border-radius: 15px;
}

.lista h3 {
  margin-bottom: 15px;
  color: #333;
}

.cita-card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 12px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  border-left: 4px solid #4facfe;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
}

.cita-info {
  flex: 1;
}

.cita-info strong {
  font-size: 16px;
  color: #333;
}

.cita-info p {
  margin-top: 5px;
  font-size: 13px;
  color: #666;
}

.btn-eliminar {
  background: #ff4444;
  padding: 8px 15px;
  font-size: 12px;
  width: auto;
  margin-bottom: 0;
}

.btn-pdf {
  background: #28a745;
  padding: 8px 15px;
  font-size: 12px;
  width: auto;
  margin-bottom: 0;
  margin-left: 10px;
}

.btn-pdf:hover {
  background: #218838;
}

.cita-acciones {
  display: flex;
  gap: 10px;
}

.mensaje-vacio {
  text-align: center;
  padding: 30px;
  color: #999;
}

.info-usuario {
  background: linear-gradient(135deg, #e8f4f8, #d1ecf1);
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 25px;
  text-align: center;
}

.info-usuario span {
  font-weight: bold;
  color: #4facfe;
}

.sedes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-top: 5px;
}

.doctores {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 5px;
}

.opcion-sede {
  padding: 10px;
  border: 2px solid #e0e0e0;
  border-radius: 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
}

.opcion-sede:hover {
  border-color: #4facfe;
  background: #f0f9ff;
}

.opcion-sede.seleccionada {
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  color: white;
  border-color: #4facfe;
}

.opcion-doctor {
  padding: 10px;
  border: 2px solid #e0e0e0;
  border-radius: 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  background: white;
}

.opcion-doctor:hover {
  border-color: #4facfe;
  background: #f0f9ff;
}

.opcion-doctor.seleccionado {
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  color: white;
  border-color: #4facfe;
}

.doctores-container {
  border: 1px solid #e0e0e0;
  border-radius: 10px;
  padding: 15px;
  min-height: 200px;
  background: #fafafa;
}

.doctores-container h4 {
  margin-bottom: 10px;
  color: #333;
  font-size: 14px;
}

.doctores-vacio {
  text-align: center;
  padding: 40px;
  color: #999;
  font-style: italic;
}

@media (max-width: 600px) {
  .cita-card {
    flex-direction: column;
    text-align: center;
  }
  .cita-acciones {
    margin-top: 10px;
  }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🏥 Agendar Cita Médica</h1>
    <p>Complete los datos para programar su cita</p>
  </div>
  
  <div class="formulario">
    <div id="infoUsuario" class="info-usuario"></div>

    <div class="grid-2">
      <div class="campo">
        <label>👤 Nombre del Paciente</label>
        <input type="text" id="paciente" readonly placeholder="Nombre del paciente">
      </div>
      
      <div class="campo">
        <label>📅 Fecha de la Cita</label>
        <input type="date" id="fecha">
      </div>
      
      <div class="campo">
        <label>⏰ Hora de la Cita</label>
        <input type="time" id="hora">
      </div>
      
      <div class="campo">
        <label>🏥 Seleccione Sede / Centro Médico</label>
        <div class="sedes">
          <div class="opcion-sede" data-sede="Urgencias Toberin">🏥 Urgencias Toberin</div>
          <div class="opcion-sede" data-sede="La Cardio">❤️ La Cardio</div>
          <div class="opcion-sede" data-sede="Colina">🌳 Colina</div>
        </div>
        <input type="hidden" id="centroMedico">
      </div>
      
      <div class="campo">
        <label>👨‍⚕️ Seleccione Doctor</label>
        <div id="doctoresContainer" class="doctores-container">
          <h4>Primero selecciona una sede</h4>
          <div class="doctores-vacio">🏥 Elige una sede para ver los doctores disponibles</div>
        </div>
        <input type="hidden" id="doctor">
      </div>
    </div>
    
    <button onclick="crearCita()">📅 Agendar Cita</button>
    <button onclick="verCitas()" class="btn-ver">📋 Ver Mis Citas</button>
    <button onclick="cerrarSesion()" class="btn-cerrar">🚪 Cerrar Sesión</button>
    
    <div id="lista" class="lista">
      <h3>📌 Mis Próximas Citas</h3>
      <div id="citasLista"></div>
    </div>
  </div>
</div>

<script>
const API_URL = "https://citas-medicas-slg0.onrender.com";

// Definir doctores por sede
const doctoresPorSede = {
  "Urgencias Toberin": [
    { nombre: "Julian Chavarro", especialidad: "Cardiólogo" },
    { nombre: "Camilo Carrillo", especialidad: "Médico General" },
    { nombre: "David Andres", especialidad: "Urgenciólogo" }
  ],
  "La Cardio": [
    { nombre: "Maria Jose", especialidad: "Cardióloga" },
    { nombre: "Camilo Suarez", especialidad: "Cardiólogo" },
    { nombre: "Manuela Dueñas", especialidad: "Cardióloga" }
  ],
  "Colina": [
    { nombre: "Dana Michell", especialidad: "Médico General" },
    { nombre: "Andres Quintero", especialidad: "Pediatra" },
    { nombre: "Santiago Ortiz", especialidad: "Ortopedista" }
  ]
};

// Verificar usuario logueado
const usuario = localStorage.getItem("usuario");
if (!usuario) {
  alert("Por favor inicie sesión primero");
  window.location.href = "login.html";
}

const userData = JSON.parse(usuario);
document.getElementById("paciente").value = userData.nombre;
document.getElementById("infoUsuario").innerHTML = `
  <span>👋 Bienvenido, ${userData.nombre}</span> | 📧 ${userData.correo}
`;

// Función para mostrar doctores según la sede seleccionada
function mostrarDoctoresPorSede(sede) {
  const container = document.getElementById("doctoresContainer");
  const doctores = doctoresPorSede[sede];
  
  if (!doctores || doctores.length === 0) {
    container.innerHTML = `
      <h4>👨‍⚕️ Doctores disponibles</h4>
      <div class="doctores-vacio">❌ No hay doctores disponibles para esta sede</div>
    `;
    return;
  }
  
  let html = `<h4>👨‍⚕️ Doctores disponibles en ${sede}</h4>\n`;
  html += `<div class="doctores">\n`;
  
  doctores.forEach(doctor => {
    html += `
      <div class="opcion-doctor" data-doctor="${doctor.nombre}" data-especialidad="${doctor.especialidad}">
        👨‍⚕️ ${doctor.nombre} - ${doctor.especialidad}
      </div>
    `;
  });
  
  html += `</div>\n`;
  container.innerHTML = html;
  
  // Agregar eventos de clic a los nuevos doctores
  document.querySelectorAll('.opcion-doctor').forEach(el => {
    el.addEventListener('click', function() {
      document.querySelectorAll('.opcion-doctor').forEach(d => d.classList.remove('seleccionado'));
      this.classList.add('seleccionado');
      document.getElementById('doctor').value = this.dataset.doctor;
    });
  });
}

// Selección de sede
document.querySelectorAll('.opcion-sede').forEach(el => {
  el.addEventListener('click', function() {
    document.querySelectorAll('.opcion-sede').forEach(s => s.classList.remove('seleccionada'));
    this.classList.add('seleccionada');
    const sede = this.dataset.sede;
    document.getElementById('centroMedico').value = sede;
    
    // Limpiar doctor seleccionado
    document.getElementById('doctor').value = "";
    
    // Mostrar doctores de la sede seleccionada
    mostrarDoctoresPorSede(sede);
  });
});

function cerrarSesion() {
  localStorage.removeItem("usuario");
  window.location.href = "login.html";
}

function crearCita() {
  const centroMedico = document.getElementById("centroMedico").value;
  const doctor = document.getElementById("doctor").value;
  const fecha = document.getElementById("fecha").value;
  const hora = document.getElementById("hora").value;
  const paciente = document.getElementById("paciente").value;

  if (!centroMedico) {
    alert("⚠️ Por favor seleccione una sede");
    return;
  }
  if (!doctor) {
    alert("⚠️ Por favor seleccione un doctor");
    return;
  }
  if (!fecha) {
    alert("⚠️ Por favor seleccione una fecha");
    return;
  }
  if (!hora) {
    alert("⚠️ Por favor seleccione una hora");
    return;
  }

  const datos = {
    paciente: paciente,
    fecha: fecha,
    hora: hora,
    doctor: doctor,
    centroMedico: centroMedico
  };

  fetch(`${API_URL}/citas`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(datos)
  })
  .then(async res => {
    if (res.status === 409) {
      const error = await res.json();
      alert(error.error);
      throw new Error("Horario no disponible");
    }
    if (!res.ok) {
      throw new Error("Error al agendar");
    }
    return res.json();
  })
  .then(data => {
    alert(data.mensaje);
    verCitas();
    limpiarSeleccion();
  })
  .catch(error => {
    if (error.message !== "Horario no disponible") {
      alert("❌ Error al agendar la cita. Intenta de nuevo.");
    }
    console.error("Error:", error);
  });
}

function verCitas() {
  fetch(`${API_URL}/citas`)
  .then(res => res.json())
  .then(data => {
    const citasDiv = document.getElementById("citasLista");
    const usuarioActual = JSON.parse(localStorage.getItem("usuario"));
    
    // Filtrar solo las citas del paciente logueado
    const misCitas = data.filter(c => c.paciente === usuarioActual.nombre);
    
    if (misCitas.length === 0) {
      citasDiv.innerHTML = '<div class="mensaje-vacio">📭 No tienes citas agendadas</div>';
      return;
    }
    
    citasDiv.innerHTML = "";
    misCitas.forEach(c => {
      const div = document.createElement("div");
      div.className = "cita-card";
      div.innerHTML = `
        <div class="cita-info">
          <strong>📅 ${c.fecha} - ⏰ ${c.hora}</strong>
          <p>👨‍⚕️ Doctor: ${c.doctor} | 🏥 Sede: ${c.centroMedico}</p>
        </div>
        <div class="cita-acciones">
          <button class="btn-eliminar" onclick="eliminarCita('${c._id}')">❌ Cancelar</button>
          <button class="btn-pdf" onclick="descargarPDF('${c._id}')">📄 Descargar PDF</button>
        </div>
      `;
      citasDiv.appendChild(div);
    });
  });
}

function eliminarCita(id) {
  if (confirm("¿Estás seguro de cancelar esta cita?")) {
    fetch(`${API_URL}/citas/${id}`, { method: "DELETE" })
    .then(() => {
      alert("Cita cancelada");
      verCitas();
    });
  }
}

function descargarPDF(idCita) {
  // Mostrar mensaje de carga
  const loadingMsg = alert("⏳ Generando PDF, por favor espera...");
  
  fetch(`${API_URL}/citas`)
    .then(res => res.json())
    .then(citas => {
      const cita = citas.find(c => c._id === idCita);
      
      if (!cita) {
        alert("❌ No se encontró la cita");
        return;
      }
      
      // Crear el HTML del PDF
      const contenido = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>Comprobante de Cita Médica</title>
          <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { font-family: 'Segoe UI', Arial, sans-serif; padding: 40px; background: #f0f0f0; }
            .pdf-container { max-width: 600px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
            .pdf-header { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; padding: 30px; text-align: center; }
            .pdf-header h1 { font-size: 28px; margin-bottom: 5px; }
            .pdf-header p { font-size: 14px; opacity: 0.9; }
            .pdf-body { padding: 30px; }
            .campo { margin-bottom: 20px; padding: 10px; border-bottom: 2px solid #f0f0f0; }
            .campo strong { color: #4facfe; display: inline-block; width: 120px; font-size: 14px; }
            .campo span { color: #333; font-size: 14px; }
            .pdf-footer { background: #f8f9fa; padding: 20px; text-align: center; font-size: 12px; color: #666; border-top: 1px solid #eee; }
            .mensaje-final { text-align: center; margin-top: 15px; color: #4facfe; font-size: 12px; }
          </style>
        </head>
        <body>
          <div class="pdf-container">
            <div class="pdf-header">
              <h1>🏥 Clínica Médica</h1>
              <p>Comprobante de Cita</p>
            </div>
            <div class="pdf-body">
              <div class="campo"><strong>👤 Paciente:</strong> <span>${cita.paciente || 'No especificado'}</span></div>
              <div class="campo"><strong>📅 Fecha:</strong> <span>${cita.fecha || 'No especificada'}</span></div>
              <div class="campo"><strong>⏰ Hora:</strong> <span>${cita.hora || 'No especificada'}</span></div>
              <div class="campo"><strong>👨‍⚕️ Doctor:</strong> <span>${cita.doctor || 'No especificado'}</span></div>
              <div class="campo"><strong>🏥 Sede:</strong> <span>${cita.centroMedico || 'No especificada'}</span></div>
              <div class="campo"><strong>🆔 ID Cita:</strong> <span>${idCita.substring(0, 12)}...</span></div>
            </div>
            <div class="pdf-footer">
              <p>📌 Por favor llegar con 15 minutos de anticipación</p>
              <p class="mensaje-final">✓ Generado el ${new Date().toLocaleString()}</p>
            </div>
          </div>
        </body>
        </html>
      `;
      
      // Crear un iframe oculto para generar el PDF
      const iframe = document.createElement('iframe');
      iframe.style.position = 'absolute';
      iframe.style.left = '-9999px';
      iframe.style.top = '-9999px';
      iframe.style.width = '800px';
      iframe.style.height = '600px';
      document.body.appendChild(iframe);
      
      iframe.contentWindow.document.open();
      iframe.contentWindow.document.write(contenido);
      iframe.contentWindow.document.close();
      
      // Esperar a que cargue el contenido
      setTimeout(() => {
        html2pdf().from(iframe.contentWindow.document.body).set({
          margin: [0.5, 0.5, 0.5, 0.5],
          filename: `cita_${cita.fecha}_${cita.hora.replace(/:/g, '-')}.pdf`,
          html2canvas: { scale: 2, logging: false, useCORS: true },
          jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        }).save().then(() => {
          document.body.removeChild(iframe);
          console.log("PDF generado correctamente");
        }).catch(err => {
          console.error("Error generando PDF:", err);
          alert("❌ Error al generar el PDF");
          document.body.removeChild(iframe);
        });
      }, 1000);
    })
    .catch(error => {
      console.error("Error:", error);
      alert("❌ Error al obtener los datos de la cita");
    });
}

function limpiarSeleccion() {
  document.querySelectorAll('.opcion-sede').forEach(s => s.classList.remove('seleccionada'));
  document.getElementById('centroMedico').value = "";
  document.getElementById('doctor').value = "";
  document.getElementById('fecha').value = "";
  document.getElementById('hora').value = "";
  
  // Resetear doctores
  const container = document.getElementById("doctoresContainer");
  container.innerHTML = `
    <h4>Primero selecciona una sede</h4>
    <div class="doctores-vacio">🏥 Elige una sede para ver los doctores disponibles</div>
  `;
}

// Cargar citas al entrar
verCitas();
</script>
</body>
</html>
