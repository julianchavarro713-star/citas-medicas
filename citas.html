<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agendar Cita Médica</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #4facfe, #00f2fe); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; padding: 30px; text-align: center; }
        .header h1 { margin-bottom: 10px; }
        .formulario { padding: 30px; }
        .campo { margin-bottom: 20px; }
        .campo label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; font-size: 14px; }
        .campo input, .campo select, .campo textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; }
        .campo input:focus, .campo select:focus { outline: none; border-color: #4facfe; }
        .campo input[readonly] { background-color: #f5f5f5; cursor: not-allowed; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: transform 0.2s; }
        button:hover { transform: translateY(-2px); }
        .btn-cerrar { background: linear-gradient(135deg, #ff4444, #cc0000); }
        .btn-ver { background: linear-gradient(135deg, #667eea, #764ba2); }
        .lista { margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 15px; }
        .lista h3 { margin-bottom: 15px; color: #333; }
        .cita-card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 4px solid #4facfe; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .cita-info { flex: 1; }
        .cita-info strong { font-size: 16px; color: #333; }
        .cita-info p { margin-top: 5px; font-size: 13px; color: #666; }
        .btn-eliminar { background: #ff4444; padding: 8px 15px; font-size: 12px; width: auto; margin-bottom: 0; }
        .mensaje-vacio { text-align: center; padding: 30px; color: #999; }
        .info-usuario { background: linear-gradient(135deg, #e8f4f8, #d1ecf1); padding: 15px; border-radius: 10px; margin-bottom: 25px; text-align: center; }
        .info-usuario span { font-weight: bold; color: #4facfe; }
        .sedes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 5px; }
        .doctores { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        .opcion-sede { padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; text-align: center; cursor: pointer; transition: all 0.3s; background: white; }
        .opcion-sede:hover { border-color: #4facfe; background: #f0f9ff; }
        .opcion-sede.seleccionada { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; border-color: #4facfe; }
        .opcion-doctor { padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; text-align: center; cursor: pointer; transition: all 0.3s; background: white; }
        .opcion-doctor:hover { border-color: #4facfe; background: #f0f9ff; }
        .opcion-doctor.seleccionado { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; border-color: #4facfe; }
        .doctores-container { border: 1px solid #e0e0e0; border-radius: 10px; padding: 15px; min-height: 200px; background: #fafafa; }
        .doctores-container h4 { margin-bottom: 10px; color: #333; font-size: 14px; }
        .doctores-vacio { text-align: center; padding: 40px; color: #999; font-style: italic; }
        @media (max-width: 600px) { .cita-card { flex-direction: column; text-align: center; } .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>🏥 Agendar Cita Médica</h1><p>Complete los datos para programar su cita</p></div>
    <div class="formulario">
        <div id="infoUsuario" class="info-usuario"></div>
        <div class="grid-2">
            <div class="campo"><label>👤 Nombre del Paciente</label><input type="text" id="paciente" readonly></div>
            <div class="campo"><label>📅 Fecha de la Cita</label><input type="date" id="fecha"></div>
            <div class="campo"><label>⏰ Hora de la Cita</label><input type="time" id="hora"></div>
            <div class="campo">
                <label>🏥 Seleccione Sede / Centro Médico</label>
                <div class="sedes">
                    <div class="opcion-sede" data-sede="Urgencias Toberin">🏥 Urgencias Toberin</div>
                    <div class="opcion-sede" data-sede="La Cardio">❤️ La Cardio</div>
                    <div class="opcion-sede" data-sede="Colina">🌳 Colina</div>
                </div>
                <input type="hidden" id="centroMedico">
            </div>
            <div class="campo">
                <label>👨‍⚕️ Seleccione Doctor</label>
                <div id="doctoresContainer" class="doctores-container">
                    <h4>Primero selecciona una sede</h4>
                    <div class="doctores-vacio">🏥 Elige una sede para ver los doctores disponibles</div>
                </div>
                <input type="hidden" id="doctor">
            </div>
        </div>
        <div class="campo"><label>📋 Motivo de Consulta (Opcional)</label><textarea id="motivo" rows="2"></textarea></div>
        <button onclick="crearCita()">📅 Agendar Cita</button>
        <button onclick="verCitas()" class="btn-ver">📋 Ver Mis Citas</button>
        <button onclick="cerrarSesion()" class="btn-cerrar">🚪 Cerrar Sesión</button>
        <div id="lista" class="lista"><h3>📌 Mis Próximas Citas</h3><div id="citasLista"></div></div>
    </div>
</div>
<script>
const API_URL = "https://citas-medicas-backend-gitlab.onrender.com";

const doctoresPorSede = {
    "Urgencias Toberin": [
        { nombre: "Julian Chavarro", especialidad: "Cardiólogo" },
        { nombre: "Camilo Carrillo", especialidad: "Médico General" },
        { nombre: "David Andres", especialidad: "Urgenciólogo" }
    ],
    "La Cardio": [
        { nombre: "Maria Jose", especialidad: "Cardióloga" },
        { nombre: "Camilo Suarez", especialidad: "Cardiólogo" },
        { nombre: "Manuela Dueñas", especialidad: "Cardióloga" }
    ],
    "Colina": [
        { nombre: "Dana Michell", especialidad: "Médico General" },
        { nombre: "Andres Quintero", especialidad: "Pediatra" },
        { nombre: "Santiago Ortiz", especialidad: "Ortopedista" }
    ]
};

const usuario = localStorage.getItem("usuario");
if (!usuario) { alert("Por favor inicie sesión primero"); window.location.href = "login.html"; }
const userData = JSON.parse(usuario);
document.getElementById("paciente").value = userData.nombre;
document.getElementById("infoUsuario").innerHTML = `<span>👋 Bienvenido, ${userData.nombre}</span> | 📧 ${userData.correo}`;

function mostrarDoctoresPorSede(sede) {
    const container = document.getElementById("doctoresContainer");
    const doctores = doctoresPorSede[sede];
    if (!doctores) {
        container.innerHTML = `<h4>👨‍⚕️ Doctores disponibles</h4><div class="doctores-vacio">❌ No hay doctores disponibles</div>`;
        return;
    }
    let html = `<h4>👨‍⚕️ Doctores disponibles en ${sede}</h4><div class="doctores">`;
    doctores.forEach(doctor => {
        html += `<div class="opcion-doctor" data-doctor="${doctor.nombre}">👨‍⚕️ ${doctor.nombre} - ${doctor.especialidad}</div>`;
    });
    html += `</div>`;
    container.innerHTML = html;
    document.querySelectorAll('.opcion-doctor').forEach(el => {
        el.addEventListener('click', function() {
            document.querySelectorAll('.opcion-doctor').forEach(d => d.classList.remove('seleccionado'));
            this.classList.add('seleccionado');
            document.getElementById('doctor').value = this.dataset.doctor;
        });
    });
}

document.querySelectorAll('.opcion-sede').forEach(el => {
    el.addEventListener('click', function() {
        document.querySelectorAll('.opcion-sede').forEach(s => s.classList.remove('seleccionada'));
        this.classList.add('seleccionada');
        const sede = this.dataset.sede;
        document.getElementById('centroMedico').value = sede;
        document.getElementById('doctor').value = "";
        mostrarDoctoresPorSede(sede);
    });
});

function cerrarSesion() { localStorage.removeItem("usuario"); window.location.href = "login.html"; }

function crearCita() {
    const centroMedico = document.getElementById("centroMedico").value;
    const doctor = document.getElementById("doctor").value;
    const fecha = document.getElementById("fecha").value;
    const hora = document.getElementById("hora").value;
    const paciente = document.getElementById("paciente").value;
    const motivo = document.getElementById("motivo").value;
    
    if (!centroMedico || !doctor || !fecha || !hora) { 
        alert("⚠️ Por favor complete todos los campos"); 
        return; 
    }
    
    const datos = { 
        paciente, 
        fecha, 
        hora, 
        doctor, 
        centroMedico, 
        motivo: motivo || "No especificado",
        estado: "pendiente",
        multa: 0
    };
    
    fetch(API_URL + "/citas", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
    })
    .then(async res => {
        if (res.status === 409) { 
            const error = await res.json(); 
            alert(error.error); 
            throw new Error("Horario no disponible"); 
        }
        if (!res.ok) throw new Error("Error");
        return res.json();
    })
    .then(data => { 
        alert(data.mensaje); 
        verCitas(); 
        limpiarSeleccion(); 
    })
    .catch(error => { 
        if (error.message !== "Horario no disponible") 
            alert("❌ Error al agendar la cita"); 
    });
}

function verCitas() {
    fetch(API_URL + "/citas")
    .then(res => res.json())
    .then(data => {
        const citasDiv = document.getElementById("citasLista");
        const usuarioActual = JSON.parse(localStorage.getItem("usuario"));
        const misCitas = data.filter(c => c.paciente === usuarioActual.nombre);
        if (misCitas.length === 0) { citasDiv.innerHTML = '<div class="mensaje-vacio">📭 No tienes citas agendadas</div>'; return; }
        citasDiv.innerHTML = "";
        misCitas.forEach(c => {
            const div = document.createElement("div");
            div.className = "cita-card";
            
            let estadoColor = "";
            let estadoTexto = c.estado || "pendiente";
            switch (estadoTexto) {
                case "cancelada": estadoColor = "#ff4444"; break;
                case "no_asistio": estadoColor = "#ff9800"; break;
                default: estadoColor = "#4facfe";
            }
            
            let multaHtml = "";
            if (c.multa && c.multa > 0) {
                multaHtml = `<p style="color:#ff4444;">💰 Multa: $${c.multa.toLocaleString()}</p>`;
            }
            
            const fechaHoraCita = new Date(`${c.fecha}T${c.hora}`);
            const ahora = new Date();
            const diffHoras = (fechaHoraCita - ahora) / (1000 * 60 * 60);
            const puedeCancelar = (estadoTexto === "pendiente") && diffHoras > 1;
            
            let botonCancelar = '';
            if (puedeCancelar) {
                botonCancelar = `<button class="btn-eliminar" onclick="eliminarCita('${c._id}')">❌ Cancelar</button>`;
            } else if (estadoTexto === "pendiente" && diffHoras <= 1 && diffHoras > 0) {
                botonCancelar = `<button class="btn-eliminar" disabled style="background:#ccc;">⏰ No se puede cancelar</button>`;
            }
            
            div.innerHTML = `
                <div class="cita-info">
                    <strong>📅 ${c.fecha} - ⏰ ${c.hora}</strong>
                    <p>👨‍⚕️ Doctor: ${c.doctor} | 🏥 Sede: ${c.centroMedico}</p>
                    <p style="color: ${estadoColor}; font-weight: bold;">📌 Estado: ${estadoTexto.toUpperCase()}</p>
                    ${multaHtml}
                </div>
                <div class="cita-acciones">
                    ${botonCancelar}
                </div>
            `;
            citasDiv.appendChild(div);
        });
    });
}

function eliminarCita(id) { if(confirm("¿Estás seguro de cancelar esta cita?")) fetch(API_URL + "/citas/" + id, { method: "DELETE" }).then(() => verCitas()); }

function limpiarSeleccion() {
    document.querySelectorAll('.opcion-sede').forEach(s => s.classList.remove('seleccionada'));
    document.getElementById('centroMedico').value = "";
    document.getElementById('doctor').value = "";
    document.getElementById('fecha').value = "";
    document.getElementById('hora').value = "";
    document.getElementById('motivo').value = "";
    document.getElementById("doctoresContainer").innerHTML = `<h4>Primero selecciona una sede</h4><div class="doctores-vacio">🏥 Elige una sede para ver los doctores disponibles</div>`;
}

verCitas();
</script>
</body>
</html>
