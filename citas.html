<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Agendar Cita Médica</title>
<!-- Librería para generar PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 800px;
  margin: 0 auto;
  background: white;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  overflow: hidden;
}

.header {
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  color: white;
  padding: 30px;
  text-align: center;
}

.header h1 {
  margin-bottom: 10px;
}

.header p {
  opacity: 0.9;
}

.formulario {
  padding: 30px;
}

.campo {
  margin-bottom: 20px;
}

.campo label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
  color: #333;
  font-size: 14px;
}

.campo input, .campo select {
  width: 100%;
  padding: 12px;
  border: 2px solid #e0e0e0;
  border-radius: 10px;
  font-size: 14px;
  transition: border-color 0.3s;
}

.campo input:focus, .campo select:focus {
  outline: none;
  border-color: #4facfe;
}

.campo input[readonly] {
  background-color: #f5f5f5;
  cursor: not-allowed;
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

button {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s;
  margin-bottom: 10px;
}

button:hover {
  transform: translateY(-2px);
}

.btn-cerrar {
  background: linear-gradient(135deg, #ff4444, #cc0000);
}

.btn-ver {
  background: linear-gradient(135deg, #667eea, #764ba2);
}

.lista {
  margin-top: 30px;
  padding: 20px;
  background: #f8f9fa;
  border-radius: 15px;
}

.lista h3 {
  margin-bottom: 15px;
  color: #333;
}

.cita-card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 12px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  border-left: 4px solid #4facfe;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
}

.cita-info {
  flex: 1;
}

.cita-info strong {
  font-size: 16px;
  color: #333;
}

.cita-info p {
  margin-top: 5px;
  font-size: 13px;
  color: #666;
}

.btn-eliminar {
  background: #ff4444;
  padding: 8px 15px;
  font-size: 12px;
  width: auto;
  margin-bottom: 0;
}

.btn-pdf {
  background: #28a745;
  padding: 8px 15px;
  font-size: 12px;
  width: auto;
  margin-bottom: 0;
  margin-left: 10px;
}

.btn-pdf:hover {
  background: #218838;
}

.cita-acciones {
  display: flex;
  gap: 10px;
}

.mensaje-vacio {
  text-align: center;
  padding: 30px;
  color: #999;
}

.info-usuario {
  background: linear-gradient(135deg, #e8f4f8, #d1ecf1);
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 25px;
  text-align: center;
}

.info-usuario span {
  font-weight: bold;
  color: #4facfe;
}

.sedes, .doctores {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-top: 5px;
}

.opcion-sede, .opcion-doctor {
  padding: 10px;
  border: 2px solid #e0e0e0;
  border-radius: 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
}

.opcion-sede:hover, .opcion-doctor:hover {
  border-color: #4facfe;
  background: #f0f9ff;
}

.opcion-sede.seleccionada, .opcion-doctor.seleccionado {
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  color: white;
  border-color: #4facfe;
}

@media (max-width: 600px) {
  .cita-card {
    flex-direction: column;
    text-align: center;
  }
  .cita-acciones {
    margin-top: 10px;
  }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🏥 Agendar Cita Médica</h1>
    <p>Complete los datos para programar su cita</p>
  </div>
  
  <div class="formulario">
    <div id="infoUsuario" class="info-usuario"></div>

    <div class="grid-2">
      <div class="campo">
        <label>👤 Nombre del Paciente</label>
        <input type="text" id="paciente" readonly placeholder="Nombre del paciente">
      </div>
      
      <div class="campo">
        <label>📅 Fecha de la Cita</label>
        <input type="date" id="fecha">
      </div>
      
      <div class="campo">
        <label>⏰ Hora de la Cita</label>
        <input type="time" id="hora">
      </div>
      
      <div class="campo">
        <label>🏥 Seleccione Sede / Centro Médico</label>
        <div class="sedes">
          <div class="opcion-sede" data-sede="Urgencias Toberin">🏥 Urgencias Toberin</div>
          <div class="opcion-sede" data-sede="La Cardio">❤️ La Cardio</div>
          <div class="opcion-sede" data-sede="Colina">🌳 Colina</div>
        </div>
        <input type="hidden" id="centroMedico">
      </div>
      
      <div class="campo">
        <label>👨‍⚕️ Seleccione Doctor</label>
        <div class="doctores">
          <!-- Doctores con atributo data-sede para filtrar -->
          <div class="opcion-doctor" data-doctor="Julian Chavarro" data-sede="todas">👨‍⚕️ Julian Chavarro - Cardiólogo</div>
          <div class="opcion-doctor" data-doctor="Camilo Carrillo" data-sede="todas">👨‍⚕️ Camilo Carrillo - Médico General</div>
          <div class="opcion-doctor" data-doctor="Andrea Cardenas" data-sede="Urgencias Toberin">👩‍⚕️ Andrea Cardenas - Pediatra</div>
          <div class="opcion-doctor" data-doctor="Carlos Lopez" data-sede="La Cardio">👨‍⚕️ Carlos López - Dermatólogo</div>
          <div class="opcion-doctor" data-doctor="Maria Rodriguez" data-sede="Colina">👩‍⚕️ María Rodríguez - Ginecóloga</div>
        </div>
        <input type="hidden" id="doctor">
      </div>
    </div>
    
    <button onclick="crearCita()">📅 Agendar Cita</button>
    <button onclick="verCitas()" class="btn-ver">📋 Ver Mis Citas</button>
    <button onclick="cerrarSesion()" class="btn-cerrar">🚪 Cerrar Sesión</button>
    
    <div id="lista" class="lista">
      <h3>📌 Mis Próximas Citas</h3>
      <div id="citasLista"></div>
    </div>
  </div>
</div>

<script>
const API_URL = "https://citas-medicas-slg0.onrender.com";

// Verificar usuario logueado
const usuario = localStorage.getItem("usuario");
if (!usuario) {
  alert("Por favor inicie sesión primero");
  window.location.href = "login.html";
}

const userData = JSON.parse(usuario);
document.getElementById("paciente").value = userData.nombre;
document.getElementById("infoUsuario").innerHTML = `
  <span>👋 Bienvenido, ${userData.nombre}</span> | 📧 ${userData.correo}
`;

// Función para filtrar doctores según la sede seleccionada
function filtrarDoctoresPorSede(sedeSeleccionada) {
  const doctores = document.querySelectorAll('.opcion-doctor');
  doctores.forEach(doctor => {
    const sedeDoctor = doctor.getAttribute('data-sede');
    if (sedeDoctor === 'todas' || sedeDoctor === sedeSeleccionada) {
      doctor.style.display = 'block';
    } else {
      doctor.style.display = 'none';
    }
  });
  
  // Limpiar selección de doctor
  document.getElementById('doctor').value = "";
  document.querySelectorAll('.opcion-doctor').forEach(d => d.classList.remove('seleccionado'));
}

// Selección de sede (con filtro de doctores)
document.querySelectorAll('.opcion-sede').forEach(el => {
  el.addEventListener('click', function() {
    document.querySelectorAll('.opcion-sede').forEach(s => s.classList.remove('seleccionada'));
    this.classList.add('seleccionada');
    document.getElementById('centroMedico').value = this.dataset.sede;
    // Filtrar doctores según la sede elegida
    filtrarDoctoresPorSede(this.dataset.sede);
  });
});

// Selección de doctor
document.querySelectorAll('.opcion-doctor').forEach(el => {
  el.addEventListener('click', function() {
    document.querySelectorAll('.opcion-doctor').forEach(d => d.classList.remove('seleccionado'));
    this.classList.add('seleccionado');
    document.getElementById('doctor').value = this.dataset.doctor;
  });
});

function cerrarSesion() {
  localStorage.removeItem("usuario");
  window.location.href = "login.html";
}

function crearCita() {
  const centroMedico = document.getElementById("centroMedico").value;
  const doctor = document.getElementById("doctor").value;
  const fecha = document.getElementById("fecha").value;
  const hora = document.getElementById("hora").value;
  const paciente = document.getElementById("paciente").value;

  if (!centroMedico) {
    alert("⚠️ Por favor seleccione una sede");
    return;
  }
  if (!doctor) {
    alert("⚠️ Por favor seleccione un doctor");
    return;
  }
  if (!fecha) {
    alert("⚠️ Por favor seleccione una fecha");
    return;
  }
  if (!hora) {
    alert("⚠️ Por favor seleccione una hora");
    return;
  }

  const datos = {
    paciente: paciente,
    fecha: fecha,
    hora: hora,
    doctor: doctor,
    centroMedico: centroMedico
  };

  fetch(`${API_URL}/citas`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(datos)
  })
  .then(async res => {
    if (res.status === 409) {
      const error = await res.json();
      alert(error.error);
      throw new Error("Horario no disponible");
    }
    if (!res.ok) {
      throw new Error("Error al agendar");
    }
    return res.json();
  })
  .then(data => {
    alert(data.mensaje);
    verCitas();
    limpiarSeleccion();
  })
  .catch(error => {
    if (error.message !== "Horario no disponible") {
      alert("❌ Error al agendar la cita. Intenta de nuevo.");
    }
    console.error("Error:", error);
  });
}

function verCitas() {
  fetch(`${API_URL}/citas`)
  .then(res => res.json())
  .then(data => {
    const citasDiv = document.getElementById("citasLista");
    const usuarioActual = JSON.parse(localStorage.getItem("usuario"));
    
    // Filtrar solo las citas del paciente logueado
    const misCitas = data.filter(c => c.paciente === usuarioActual.nombre);
    
    if (misCitas.length === 0) {
      citasDiv.innerHTML = '<div class="mensaje-vacio">📭 No tienes citas agendadas</div>';
      return;
    }
    
    citasDiv.innerHTML = "";
    misCitas.forEach(c => {
      const div = document.createElement("div");
      div.className = "cita-card";
      div.innerHTML = `
        <div class="cita-info">
          <strong>📅 ${c.fecha} - ⏰ ${c.hora}</strong>
          <p>👨‍⚕️ Doctor: ${c.doctor} | 🏥 Sede: ${c.centroMedico}</p>
        </div>
        <div class="cita-acciones">
          <button class="btn-eliminar" onclick="eliminarCita('${c._id}')">❌ Cancelar</button>
          <button class="btn-pdf" onclick="descargarPDF('${c._id}')">📄 Descargar PDF</button>
        </div>
      `;
      citasDiv.appendChild(div);
    });
  });
}

function eliminarCita(id) {
  if (confirm("¿Estás seguro de cancelar esta cita?")) {
    fetch(`${API_URL}/citas/${id}`, { method: "DELETE" })
    .then(() => {
      alert("Cita cancelada");
      verCitas();
    });
  }
}

function descargarPDF(idCita) {
  // Buscar la cita específica
  fetch(`${API_URL}/citas`)
    .then(res => res.json())
    .then(citas => {
      const cita = citas.find(c => c._id === idCita);
      
      if (!cita) {
        alert("No se encontró la cita");
        return;
      }
      
      // Crear el contenido del PDF
      const contenido = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>Comprobante de Cita Médica</title>
          <style>
            body {
              font-family: Arial, sans-serif;
              padding: 40px;
            }
            h1 {
              color: #4facfe;
              text-align: center;
            }
            .comprobante {
              border: 1px solid #ddd;
              padding: 20px;
              border-radius: 10px;
              max-width: 500px;
              margin: 0 auto;
            }
            .campo {
              margin: 15px 0;
              padding: 8px;
              border-bottom: 1px solid #eee;
            }
            .campo strong {
              color: #333;
            }
            .fecha {
              text-align: center;
              margin-top: 30px;
              color: #999;
              font-size: 12px;
            }
          </style>
        </head>
        <body>
          <div class="comprobante">
            <h1>🏥 Clínica Médica</h1>
            <h2 style="text-align:center;">Comprobante de Cita</h2>
            
            <div class="campo">
              <strong>👤 Paciente:</strong> ${cita.paciente}
            </div>
            <div class="campo">
              <strong>📅 Fecha:</strong> ${cita.fecha}
            </div>
            <div class="campo">
              <strong>⏰ Hora:</strong> ${cita.hora}
            </div>
            <div class="campo">
              <strong>👨‍⚕️ Doctor:</strong> ${cita.doctor}
            </div>
            <div class="campo">
              <strong>🏥 Sede:</strong> ${cita.centroMedico}
            </div>
            
            <div class="fecha">
              Generado el ${new Date().toLocaleString()}
            </div>
          </div>
        </body>
        </html>
      `;
      
      // Crear un elemento temporal para generar el PDF
      const element = document.createElement('div');
      element.innerHTML = contenido;
      document.body.appendChild(element);
      
      // Generar PDF
      html2pdf().from(element).set({
        margin: [0.5, 0.5, 0.5, 0.5],
        filename: `cita_${cita.fecha}_${cita.hora}.pdf`,
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      }).save().then(() => {
        document.body.removeChild(element);
      });
    });
}

function limpiarSeleccion() {
  document.querySelectorAll('.opcion-sede').forEach(s => s.classList.remove('seleccionada'));
  document.querySelectorAll('.opcion-doctor').forEach(d => d.classList.remove('seleccionado'));
  document.getElementById('centroMedico').value = "";
  document.getElementById('doctor').value = "";
  document.getElementById('fecha').value = "";
  document.getElementById('hora').value = "";
}

// Cargar citas al entrar
verCitas();
</script>
</body>
</html>
